<ion-tabs>
  <ion-tab-bar slot="bottom" class="zoro-tabbar">
    <ion-tab-button tab="vault"><ion-icon name="grid-outline"></ion-icon><ion-label>Vault</ion-label></ion-tab-button>
    <ion-tab-button tab="documents"><ion-icon name="documents-outline"></ion-icon><ion-label>Documents</ion-label></ion-tab-button>
    <div class="fab-gap" aria-hidden="true"></div>
    <ion-tab-button tab="alerts">
      <ion-icon name="notifications-outline"></ion-icon><ion-label>Alerts</ion-label>
      <ion-badge *ngIf="alerts$ | async as n" color="danger">{{ n }}</ion-badge>
    </ion-tab-button>
    <ion-tab-button tab="profile"><ion-icon name="person-outline"></ion-icon><ion-label>Profile</ion-label></ion-tab-button>
  </ion-tab-bar>
</ion-tabs>

<button class="scan-fab" type="button" (click)="add()" aria-label="Add document">
  <span class="pulse"></span>
  <ion-icon name="scan-outline"></ion-icon>
</button>
